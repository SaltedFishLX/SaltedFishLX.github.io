<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>电子校园卡 本地编辑器</title>
  <style>
    *{box-sizing:border-box} body{margin:0;padding:24px;background:#f5f7fb;color:#0f172a;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
    .wrap{max-width:820px;margin:0 auto}.card{background:#fff;border:1px solid #e2e8f0;border-radius:24px;padding:20px;box-shadow:0 10px 30px rgba(15,23,42,.06)}
    h1{margin:0 0 8px;font-size:28px} p{margin:0 0 20px;color:#475569;line-height:1.6}
    .grid{display:grid;gap:14px}.field label{display:block;margin-bottom:6px;font-weight:600;font-size:14px}
    .field input{width:100%;padding:12px 14px;border:1px solid #dbe2ea;border-radius:14px;font-size:14px;background:#fff}.field input[type="range"]{padding:0}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
    button{border:none;border-radius:14px;padding:12px 18px;font-size:14px;font-weight:600;cursor:pointer}.primary{background:#2563eb;color:#fff}.secondary{background:#e2e8f0;color:#0f172a}
    .hint{margin-top:16px;padding:14px 16px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:16px;color:#475569;font-size:14px;line-height:1.7}
    @media (max-width:640px){body{padding:14px}.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap"><div class="card">
    <h1>电子校园卡本地编辑器</h1>
    <p>这个页面只用于本地配置，不放到公开网页里。配置会保存到浏览器本地存储。公开访问时打开 <strong>index.html</strong>，本地修改时打开 <strong>editor.html</strong>。</p>
    <div class="grid">
      <div class="field"><label for="bannerUpload">上传左上角图片</label><input id="bannerUpload" type="file" accept="image/*"></div>
      <div class="row">
        <div class="field"><label for="bannerX">左上角图片左右位置</label><input id="bannerX" type="range" min="-120" max="120" value="0"></div>
        <div class="field"><label for="bannerY">左上角图片上下位置</label><input id="bannerY" type="range" min="-60" max="60" value="0"></div>
      </div>
      <div class="field"><label for="bannerScale">左上角图片缩放</label><input id="bannerScale" type="range" min="50" max="180" value="100"></div>
      <div class="field"><label for="photoUpload">上传照片</label><input id="photoUpload" type="file" accept="image/*"></div>
      <div class="field"><label for="nameInput">姓名</label><input id="nameInput" type="text" value="林骁"></div>
      <div class="field"><label for="sidInput">SID</label><input id="sidInput" type="text" value="12432437"></div>
      <div class="field"><label for="deptInput">部门</label><input id="deptInput" type="text" value="机械与能源工程系"></div>
    </div>
    <div class="btns"><button id="saveBtn" class="primary" type="button">保存到本地</button><button id="resetBtn" class="secondary" type="button">恢复默认</button></div>
    <div class="hint">保存后，直接打开同目录下的 <strong>index.html</strong> 查看效果。<br>GitHub Pages 公开页面里不会显示上传入口和滑块。</div>
  </div></div>
  <script>
    const DEFAULTS={name:"林骁",sid:"12432437",department:"机械与能源工程系",bannerImg:"",bannerX:0,bannerY:0,bannerScale:100,photoImg:""};
    function loadConfig(){try{return {...DEFAULTS,...(JSON.parse(localStorage.getItem("campusCardConfig")||"{}"))};}catch{return {...DEFAULTS};}}
    let state=loadConfig();
    const el={bannerUpload:document.getElementById("bannerUpload"),bannerX:document.getElementById("bannerX"),bannerY:document.getElementById("bannerY"),bannerScale:document.getElementById("bannerScale"),photoUpload:document.getElementById("photoUpload"),nameInput:document.getElementById("nameInput"),sidInput:document.getElementById("sidInput"),deptInput:document.getElementById("deptInput"),saveBtn:document.getElementById("saveBtn"),resetBtn:document.getElementById("resetBtn")};
    function sync(){el.bannerX.value=Number(state.bannerX)||0;el.bannerY.value=Number(state.bannerY)||0;el.bannerScale.value=Number(state.bannerScale)||100;el.nameInput.value=state.name||"";el.sidInput.value=state.sid||"";el.deptInput.value=state.department||"";}
    function readImage(file,cb){if(!file)return;const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(file);}
    el.bannerUpload.addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];readImage(f,src=>{state.bannerImg=src;});});
    el.photoUpload.addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];readImage(f,src=>{state.photoImg=src;});});
    el.bannerX.addEventListener("input",e=>{state.bannerX=Number(e.target.value);});
    el.bannerY.addEventListener("input",e=>{state.bannerY=Number(e.target.value);});
    el.bannerScale.addEventListener("input",e=>{state.bannerScale=Number(e.target.value);});
    el.nameInput.addEventListener("input",e=>{state.name=e.target.value;});
    el.sidInput.addEventListener("input",e=>{state.sid=e.target.value;});
    el.deptInput.addEventListener("input",e=>{state.department=e.target.value;});
    el.saveBtn.addEventListener("click",()=>{localStorage.setItem("campusCardConfig",JSON.stringify(state));alert("已保存到本地。现在打开 index.html 查看。");});
    el.resetBtn.addEventListener("click",()=>{localStorage.setItem("campusCardConfig",JSON.stringify(DEFAULTS));state={...DEFAULTS};sync();alert("已恢复默认。");});
    sync();
  </script>
</body>
</html>
