<!DOCTYPE html>
<html>
<head>
    <title>电子校园卡</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f0f0f0;
        }
        img {
            width: 100%;          /* 宽度始终占满容器 */
            height: auto;         /* 高度自动保持比例 */
            max-height: 75vh;     /* 最大高度不超过视口75% */
            object-fit: contain;  /* 核心自适应技术 */
        }
    </style>
</head>
<body>
    <!-- 替换your-image.jpg为你的实际文件名 -->
    <img src="SID.png" alt="我的图片">
</body>
</html>
