<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>电子校园卡</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
:root{
  --bg1:#a9d4cc;
  --bg2:#e4ddd7;
}
body{
  margin:0;
  font-family:"PingFang SC","Microsoft YaHei";
  background:linear-gradient(var(--bg1),var(--bg2));
}
.app{
  max-width:414px;
  margin:auto;
  min-height:100vh;
  position:relative;
}
.card{
  width:290px;
  margin:80px auto;
  background:#fff;
  border-radius:30px;
  padding:20px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.1);
}
.banner{
  width:200px;
  height:50px;
  margin:auto;
  overflow:hidden;
}
.banner img{
  width:100%;
}
.photo{
  margin-top:20px;
}
.photo img{
  width:120px;
  height:150px;
  object-fit:cover;
}
.info{
  margin-top:20px;
  text-align:left;
  padding-left:30px;
  font-family:"KaiTi";
}
.info div{
  margin-bottom:10px;
}
.qr-btn{
  margin-top:20px;
  color:#ca7557;
  cursor:pointer;
}
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.3);
  display:none;
  justify-content:center;
  align-items:center;
}
.modal.show{display:flex}
.modal-box{
  background:#fff;
  padding:20px;
  border-radius:20px;
}
.close{
  position:absolute;
  right:20px;
  top:20px;
  font-size:20px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="app">

<div class="card">

<div class="banner">
  <img id="banner">
</div>

<div class="photo">
  <img id="photo">
</div>

<div class="info">
  <div>姓名：<span id="name"></span></div>
  <div>SID：<span id="sid"></span></div>
  <div>部门：<span id="dept"></span></div>
</div>

<div class="qr-btn" id="openQr">支付码</div>

</div>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div id="qrcode"></div>
    <button onclick="refresh()">刷新</button>
  </div>
</div>

<script>

let cfg

fetch("./config.json")
.then(res=>res.json())
.then(data=>{
  cfg=data

  document.getElementById("name").innerText=data.name
  document.getElementById("sid").innerText=data.sid
  document.getElementById("dept").innerText=data.department

  document.getElementById("photo").src=data.photo
  document.getElementById("banner").src=data.banner
})

function makeQR(){
  document.getElementById("qrcode").innerHTML=""
  new QRCode(document.getElementById("qrcode"),{
    text:cfg.sid+"-"+Date.now(),
    width:200,
    height:200
  })
}

document.getElementById("openQr").onclick=()=>{
  document.getElementById("modal").classList.add("show")
  makeQR()
}

function refresh(){
  makeQR()
}

document.getElementById("modal").onclick=(e)=>{
  if(e.target.id==="modal"){
    e.target.classList.remove("show")
  }
}

</script>

</body>
</html>
