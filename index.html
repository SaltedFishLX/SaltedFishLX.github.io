<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>电子校园卡</title>

<script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>

<style>
body{margin:0;font-family:PingFang SC;background:#eee}
.app{max-width:414px;margin:auto;background:#fff;height:100vh;overflow:hidden}

/* 顶部 */
.lang-row{
display:flex;justify-content:flex-end;align-items:center;
padding:20px;
}
.toggle{
width:40px;height:20px;border-radius:20px;background:#ccc;
position:relative;cursor:pointer;
}
.toggle::after{
content:"";position:absolute;width:18px;height:18px;
background:#fff;border-radius:50%;top:1px;left:1px;
transition:.2s;
}
.toggle.on{background:#00cf59}
.toggle.on::after{left:21px}

/* 学校 */
.location-row{
display:flex;justify-content:flex-end;
padding:0 20px;font-size:14px;
}

/* 卡片 */
.card{
margin:20px;
padding:20px;
border-radius:20px;
background:#fff;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

/* 信息 */
.info{margin-top:20px}
.info div{margin:8px 0}

/* 状态 */
.status{
display:flex;
justify-content:space-between;
margin-top:30px;
}

/* 余额 */
.balance{
text-align:center;
}
.balance-amount{
display:none;
align-items:center;
justify-content:center;
gap:2px;
}
.balance-amount.show{
display:flex;
}
</style>
</head>

<body>
<div class="app">

<div class="lang-row">
<button id="langToggle" class="toggle"></button>
</div>

<div class="location-row">
<span id="locationText"></span>
</div>

<div class="card">

<div class="info">
<div><span id="labelName"></span><span id="nameText"></span></div>
<div><span id="labelSid"></span><span id="sidText"></span></div>
<div><span id="labelDept"></span><span id="deptText"></span></div>
</div>

<div class="status">

<div>
<div id="statusTitle"></div>
<div id="statusValue"></div>
</div>

<div class="balance">
<div id="balanceTitle"></div>

<button id="balanceToggleBtn">👁</button>

<div id="balanceAmount" class="balance-amount">
<span id="balanceMain"></span>
<span id="balanceUnit"></span>
</div>

</div>

</div>

</div>

</div>

<script>
const state={
name:{zh:"林骁",en:"林骁"},
department:{zh:"机械与能源工程系",en:"机械与能源工程系"},
sid:"12432437",
balanceValue:"9.94",
balanceFontSize:18,
currency:"CNY",
lang:"zh",
balanceVisible:false
};

const el={
nameText:document.getElementById("nameText"),
sidText:document.getElementById("sidText"),
deptText:document.getElementById("deptText"),
labelName:document.getElementById("labelName"),
labelSid:document.getElementById("labelSid"),
labelDept:document.getElementById("labelDept"),
statusTitle:document.getElementById("statusTitle"),
statusValue:document.getElementById("statusValue"),
balanceTitle:document.getElementById("balanceTitle"),
balanceToggleBtn:document.getElementById("balanceToggleBtn"),
balanceAmount:document.getElementById("balanceAmount"),
balanceMain:document.getElementById("balanceMain"),
balanceUnit:document.getElementById("balanceUnit"),
langToggle:document.getElementById("langToggle"),
locationText:document.getElementById("locationText")
};

/* 语言 */
function applyLang(){
const isEn=state.lang==="en";

el.labelName.textContent=isEn?"NAME:":"姓名：";
el.labelSid.textContent="SID：";
el.labelDept.textContent=isEn?"DEPARTMENT:":"部门：";

el.statusTitle.textContent=isEn?"STATUS":"卡状态";
el.statusValue.textContent=isEn?"NORMAL":"正常";

el.balanceTitle.textContent=isEn?"BALANCE":"卡内余额";

el.locationText.textContent=isEn?
"📍 Southern University of Science and Technology":
"📍 南方科技大学";

el.nameText.textContent=state.name.zh;
el.deptText.textContent=state.department.zh;
el.sidText.textContent=state.sid;

el.langToggle.classList.toggle("on",isEn);
}

/* 余额 */
function applyBalance(){
el.balanceMain.textContent=state.balanceValue;
el.balanceUnit.textContent=state.lang==="en"?"CNY":"元";

el.balanceMain.style.fontSize=state.balanceFontSize+"px";
el.balanceUnit.style.fontSize=state.balanceFontSize+"px";

if(state.balanceVisible){
el.balanceAmount.classList.add("show");
el.balanceToggleBtn.style.display="none";
}else{
el.balanceAmount.classList.remove("show");
el.balanceToggleBtn.style.display="inline";
}
}

/* 点击逻辑 */
el.balanceToggleBtn.onclick=()=>{
state.balanceVisible=true;
applyBalance();
};

el.balanceAmount.onclick=()=>{
state.balanceVisible=false;
applyBalance();
};

/* 切换语言 */
el.langToggle.onclick=()=>{
state.lang=state.lang==="zh"?"en":"zh";
applyLang();
applyBalance();
};

/* 初始化 */
applyLang();
applyBalance();

/* 禁止缩放 */
document.addEventListener("gesturestart",e=>e.preventDefault());
</script>

</body>
</html>
