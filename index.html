<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>电子校园卡</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root{
      --bg-top:#a8d3cb;
      --bg-mid:#bbddd8;
      --bg-bottom:#e1ddd8;
      --card-bg:rgba(255,255,255,.96);
      --line:#e2b8b0;
      --green:#9ac43b;
      --green-dark:#96c13d;
      --gray:#7f7f7f;
      --brown:#c96d47;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      min-height:100vh;
      background:#ededed;
      font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    }
    .app{
      width:100%;
      max-width:414px;
      min-height:100vh;
      margin:0 auto;
      position:relative;
      overflow:hidden;
      background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-mid) 46%,var(--bg-bottom) 100%);
    }
    .bg-dots{
      position:absolute; inset:0; pointer-events:none; opacity:.4;
    }
    .lang-row{
      position:relative; z-index:1;
      display:flex; align-items:center; justify-content:flex-end;
      gap:10px; padding:22px 24px 0; color:rgba(255,255,255,.9);
    }
    .lang-label{font-size:12px; line-height:1}
    .toggle{
      position:relative; width:78px; height:34px; border-radius:999px;
      background:#efefef; box-shadow:inset 0 1px 2px rgba(0,0,0,.08);
    }
    .toggle::after{
      content:""; position:absolute; left:2px; top:2px;
      width:30px; height:30px; border-radius:50%;
      background:#fff; box-shadow:0 2px 5px rgba(0,0,0,.18);
    }
    .location-row{
      position:relative; z-index:1;
      margin-top:12px; display:flex; justify-content:flex-end;
      padding:0 24px; color:rgba(255,255,255,.9);
      font-family:"KaiTi","STKaiti",serif; font-size:16px;
    }
    .location-inner{display:flex; align-items:center; gap:6px}

    .campus-card{
      position:relative; z-index:1;
      width:292px; margin:56px auto 0;
      border-radius:30px; background:var(--card-bg);
      padding:18px 18px 28px;
      box-shadow:0 8px 24px rgba(0,0,0,.04);
      overflow:hidden;
    }
    .card-lines,.modal-lines{
      position:absolute; inset:0; pointer-events:none; opacity:.14;
    }
    .card-top{
      position:relative;
      display:flex; align-items:flex-start; justify-content:space-between;
      gap:8px;
    }
    .banner-box{
      position:relative; width:214px; height:54px; overflow:hidden; border-radius:4px;
    }
    .banner-box img{
      position:absolute; left:0; top:0;
      width:206px; height:48px; object-fit:contain; transform-origin:top left;
    }
    .banner-fallback,.photo-fallback{
      width:100%; height:100%; display:flex; align-items:center; justify-content:center;
      background:rgba(0,0,0,.03); color:#9aa2b2; font-size:12px;
    }

    .small-qr-btn{
      background:transparent; border:none; padding:0; cursor:pointer; flex-shrink:0;
    }
    .small-qr-wrap{display:flex; flex-direction:column; align-items:center}
    .small-qr-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:4px}
    .small-qr-grid span{
      display:block; width:14px; height:14px; border:4px solid #2f2f2f; background:#fff;
    }
    .small-qr-grid .special{position:relative}
    .small-qr-grid .special::before,.small-qr-grid .special::after{
      content:""; position:absolute; background:#2f2f2f;
      width:3px; height:3px;
    }
    .small-qr-grid .special::before{left:1px; top:1px}
    .small-qr-grid .special::after{right:1px; bottom:1px}
    .small-qr-label{
      margin-top:6px; font-size:14px; line-height:1;
      color:var(--brown); font-family:"KaiTi","STKaiti",serif;
    }

    .photo-wrap{margin-top:24px; display:flex; justify-content:center}
    .photo-box{
      width:118px; height:146px; overflow:hidden; background:#f1f1f1;
      display:flex; align-items:center; justify-content:center;
    }
    .photo-box img{width:100%; height:100%; object-fit:cover}

    .info-block{
      margin-top:28px; padding-left:34px;
      color:#000; font-family:"KaiTi","STKaiti",serif;
    }
    .info-row{
      margin-bottom:12px; display:flex; align-items:center;
      font-size:16px; line-height:1; white-space:nowrap;
    }
    .info-row:last-child{margin-bottom:0}
    .info-label{display:inline-block; width:52px}

    .status-grid{
      margin-top:58px; display:grid; grid-template-columns:1fr 1fr;
      text-align:center; font-family:"KaiTi","STKaiti",serif;
    }
    .status-col:first-child{border-right:1px solid #d1d1d1}
    .status-title{font-size:16px; color:#000}
    .status-values{
      margin-top:18px; color:var(--green-dark); font-size:16px; line-height:1;
      display:flex; flex-direction:column; gap:6px;
    }
    .eye-wrap{
      margin-top:18px; display:flex; justify-content:center; color:var(--green-dark);
    }

    .decor-pad{
      position:absolute; right:18px; bottom:26px;
      width:54px; height:54px; border-radius:50%;
      background:var(--green);
      box-shadow:0 6px 14px rgba(0,0,0,.16);
      display:flex; align-items:center; justify-content:center;
      pointer-events:none; z-index:1;
    }
    .decor-pad .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:5px}
    .decor-pad .dot{width:4px; height:4px; background:#fff; border-radius:50%}

    .modal-mask{
      position:fixed; inset:0; background:rgba(0,0,0,.28);
      display:none; align-items:flex-start; justify-content:center;
      padding:20px 14px 14px; z-index:50;
    }
    .modal-mask.show{display:flex}
    .modal-card{
      position:relative;
      width:336px; max-width:92vw; margin-top:12px;
      border-radius:30px; background:#fff;
      box-shadow:0 20px 40px rgba(0,0,0,.18);
      padding:18px 18px 26px; overflow:hidden;
    }
    .close-btn{
      position:absolute; right:20px; top:20px;
      width:46px; height:46px; border-radius:50%;
      border:3px solid var(--gray); color:var(--gray);
      background:transparent; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      font-size:22px; line-height:1; z-index:2;
    }
    .qr-stage{margin-top:54px; display:flex; justify-content:center}
    .qr-box{
      width:248px; height:248px; background:#fff;
      display:flex; align-items:center; justify-content:center;
    }
    #qrcode{
      width:248px; height:248px;
      display:flex; align-items:center; justify-content:center;
    }
    #qrcode img,#qrcode canvas{
      display:block!important;
      max-width:248px!important; max-height:248px!important;
      width:248px!important; height:248px!important;
      object-fit:contain!important; background:#fff;
    }
    .modal-tip{
      margin-top:18px; text-align:center;
      font-size:16px; color:#d0d0d0;
    }
    .refresh-btn{
      display:block; width:170px; height:54px; margin:22px auto 0;
      border:none; border-radius:14px;
      background:var(--green); color:#fff;
      font-size:19px; font-weight:600; cursor:pointer;
      box-shadow:0 2px 6px rgba(0,0,0,.12);
    }
  </style>
</head>
<body>
  <div class="app">
    <svg class="bg-dots" viewBox="0 0 414 760" preserveAspectRatio="none">
      <path d="M52 32C40 130 130 190 290 280" stroke="white" stroke-dasharray="2 6" stroke-width="1.4" fill="none" />
      <path d="M362 44C294 120 280 230 206 320" stroke="white" stroke-dasharray="2 6" stroke-width="1.4" fill="none" />
      <path d="M376 256C338 392 366 522 332 718" stroke="white" stroke-dasharray="2 6" stroke-width="1.4" fill="none" />
      <path d="M74 650C140 548 182 470 278 392" stroke="white" stroke-dasharray="2 6" stroke-width="1.4" fill="none" />
    </svg>

    <div class="lang-row">
      <div class="lang-label">中文/En</div>
      <div class="toggle"></div>
    </div>

    <div class="location-row">
      <div class="location-inner">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
          <path d="M12 2.8c-3.52 0-6.38 2.8-6.38 6.26 0 4.58 5.14 10.77 5.36 11.03a1.33 1.33 0 0 0 2.04 0c.22-.26 5.36-6.45 5.36-11.03 0-3.46-2.86-6.26-6.38-6.26Zm0 9.03a2.77 2.77 0 1 1 0-5.54 2.77 2.77 0 0 1 0 5.54Z"></path>
        </svg>
        <span>南方科技大学</span>
      </div>
    </div>

    <div class="campus-card">
      <svg class="card-lines" viewBox="0 0 292 470" preserveAspectRatio="none">
        <path d="M18 44C80 18 130 64 274 22" stroke="#e2b8b0" stroke-width="1.1" fill="none" />
        <path d="M10 118C96 72 182 124 282 96" stroke="#e2b8b0" stroke-width="1.1" fill="none" />
        <path d="M6 188C84 242 180 210 286 250" stroke="#e2b8b0" stroke-width="1.1" fill="none" />
        <path d="M12 316C94 286 192 320 286 366" stroke="#e2b8b0" stroke-width="1.1" fill="none" />
        <path d="M26 12C42 140 48 256 82 438" stroke="#e2b8b0" stroke-width="1.1" fill="none" />
        <path d="M134 0C146 138 150 252 176 458" stroke="#e2b8b0" stroke-width="1.1" fill="none" />
        <path d="M212 6C230 126 232 250 268 420" stroke="#e2b8b0" stroke-width="1.1" fill="none" />
      </svg>

      <div class="card-top">
        <div class="banner-box">
          <img id="bannerImage" alt="顶部标识" style="display:none;">
          <div id="bannerFallback" class="banner-fallback">未配置顶部图片</div>
        </div>

        <button type="button" id="openQrBtn" class="small-qr-btn">
          <div class="small-qr-wrap">
            <div class="small-qr-grid">
              <span></span><span></span><span></span><span class="special"></span>
            </div>
            <div class="small-qr-label">支付码</div>
          </div>
        </button>
      </div>

      <div class="photo-wrap">
        <div class="photo-box">
          <img id="photoImage" alt="证件照" style="display:none;">
          <div id="photoFallback" class="photo-fallback">未配置照片</div>
        </div>
      </div>

      <div class="info-block">
        <div class="info-row"><span class="info-label">姓名：</span><span id="nameText">林骁</span></div>
        <div class="info-row"><span class="info-label">SID：</span><span id="sidText">12432437</span></div>
        <div class="info-row"><span class="info-label">部门：</span><span id="deptText">机械与能源工程系</span></div>
      </div>

      <div class="status-grid">
        <div class="status-col">
          <div class="status-title">卡状态</div>
          <div class="status-values"><div>正常</div><div>可以入校</div></div>
        </div>
        <div class="status-col">
          <div class="status-title">卡内余额</div>
          <div class="eye-wrap">
            <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <div class="decor-pad" aria-hidden="true">
      <div class="grid">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
    </div>
  </div>

  <div id="qrModal" class="modal-mask">
    <div class="modal-card">
      <svg class="modal-lines" viewBox="0 0 336 520" preserveAspectRatio="none">
        <path d="M18 44C100 18 180 64 318 22" stroke="#e2b8b0" stroke-width="1.1" fill="none" />
        <path d="M10 118C96 72 202 124 326 96" stroke="#e2b8b0" stroke-width="1.1" fill="none" />
        <path d="M6 188C84 242 200 210 326 250" stroke="#e2b8b0" stroke-width="1.1" fill="none" />
        <path d="M12 316C94 286 212 320 326 366" stroke="#e2b8b0" stroke-width="1.1" fill="none" />
        <path d="M26 12C42 140 48 256 82 438" stroke="#e2b8b0" stroke-width="1.1" fill="none" />
        <path d="M134 0C146 138 150 252 176 458" stroke="#e2b8b0" stroke-width="1.1" fill="none" />
        <path d="M212 6C230 126 232 250 268 420" stroke="#e2b8b0" stroke-width="1.1" fill="none" />
      </svg>

      <button id="closeQrBtn" class="close-btn" type="button" aria-label="关闭支付码">×</button>
      <div class="qr-stage"><div class="qr-box"><div id="qrcode"></div></div></div>
      <div class="modal-tip">二维码每60s刷新一次</div>
      <button id="refreshQrBtn" class="refresh-btn" type="button">刷新</button>
    </div>
  </div>

  <script>
    const DEFAULTS = {
      name: "林骁",
      sid: "12432437",
      department: "机械与能源工程系",
      banner: "./banner.png",
      photo: "./photo.jpg",
      bannerX: 0,
      bannerY: 0,
      bannerScale: 100
    };

    const state = { ...DEFAULTS, qrSeed: `${Date.now()}-${Math.random().toString(36).slice(2,10)}` };

    const el = {
      bannerImage: document.getElementById("bannerImage"),
      bannerFallback: document.getElementById("bannerFallback"),
      photoImage: document.getElementById("photoImage"),
      photoFallback: document.getElementById("photoFallback"),
      nameText: document.getElementById("nameText"),
      sidText: document.getElementById("sidText"),
      deptText: document.getElementById("deptText"),
      openQrBtn: document.getElementById("openQrBtn"),
      qrModal: document.getElementById("qrModal"),
      closeQrBtn: document.getElementById("closeQrBtn"),
      refreshQrBtn: document.getElementById("refreshQrBtn"),
      qrcode: document.getElementById("qrcode")
    };

    async function loadConfig() {
      try {
        const res = await fetch("./config.json", { cache: "no-store" });
        if (!res.ok) throw new Error("config load failed");
        const cfg = await res.json();
        Object.assign(state, cfg);
      } catch (e) {
        console.warn("使用默认配置", e);
      }
      applyConfig();
    }

    function applyConfig() {
      el.nameText.textContent = state.name || "";
      el.sidText.textContent = state.sid || "";
      el.deptText.textContent = state.department || "";

      if (state.photo) {
        el.photoImage.src = state.photo;
        el.photoImage.style.display = "block";
        el.photoFallback.style.display = "none";
      } else {
        el.photoImage.style.display = "none";
        el.photoFallback.style.display = "flex";
      }

      if (state.banner) {
        el.bannerImage.src = state.banner;
        el.bannerImage.style.display = "block";
        el.bannerFallback.style.display = "none";
        el.bannerImage.style.transform =
          `translate(${Number(state.bannerX)||0}px, ${Number(state.bannerY)||0}px) scale(${(Number(state.bannerScale)||100)/100})`;
      } else {
        el.bannerImage.style.display = "none";
        el.bannerFallback.style.display = "flex";
      }
    }

    function getQrValue() {
      return `campus-pay-${state.sid || "00000000"}-${state.qrSeed}`;
    }

    function drawQr() {
      el.qrcode.innerHTML = "";
      new QRCode(el.qrcode, {
        text: getQrValue(),
        width: 248,
        height: 248,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
    }

    function refreshQr() {
      state.qrSeed = `${Date.now()}-${Math.random().toString(36).slice(2,12)}`;
      drawQr();
    }

    el.openQrBtn.addEventListener("click", () => {
      el.qrModal.classList.add("show");
      drawQr();
    });

    el.closeQrBtn.addEventListener("click", () => {
      el.qrModal.classList.remove("show");
    });

    el.qrModal.addEventListener("click", (e) => {
      if (e.target === el.qrModal) el.qrModal.classList.remove("show");
    });

    el.refreshQrBtn.addEventListener("click", refreshQr);

    loadConfig();
  </script>
</body>
</html>
