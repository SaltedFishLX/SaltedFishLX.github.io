<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>电子校园卡</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .image-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        img {
            object-fit: cover;
            width: 100%;
            height: 100%;
            display: block;
        }
        
        /* 添加简单的加载提示 */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.7);
            font-family: system-ui, sans-serif;
        }
        
        .rotate-hint {
            display: none;
        }
        
        @media (min-width: 768px) {
            .image-container {
                max-width: 70vh;
                max-height: 90vh;
            }
        }
    </style>
</head>
<body>
    <div class="image-container">
        <!-- 将your-image.jpg替换为你的实际图片文件名 -->
        <img src="SID.png" alt="电子校园卡" id="fullscreen-image">
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const img = document.getElementById('fullscreen-image');
            const loading = document.querySelector('.loading');
            
            img.onload = function() {
                loading.style.display = 'none';
            };
            
            // 禁用双指缩放（防止意外操作）
            document.addEventListener('touchmove', function(event) {
                if(event.touches.length > 1) {
                    event.preventDefault();
                }
            }, { passive: false });
        });
    </script>
</body>
</html>
